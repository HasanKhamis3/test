<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظم الختمة القرآنية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --primary-color: #0f5132; /* أخضر غامق */
            --secondary-color: #d1e7dd; /* أخضر فاتح */
            --accent-color: #c5a059; /* ذهبي */
            --bg-color: #f8f9fa;
            --text-color: #333;
            --white: #ffffff;
            --danger: #dc3545;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: var(--white);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 5px solid var(--primary-color);
        }

        /* رأس الصفحة */
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px dashed var(--secondary-color);
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .date-display {
            background: var(--secondary-color);
            color: var(--primary-color);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }

        /* إعدادات التاريخ */
        .settings-box {
            background: #fff3cd;
            border: 1px solid #ffecb5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        input[type="date"], input[type="text"], input[type="tel"] {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
            font-family: inherit;
        }

        /* نموذج الإضافة */
        .add-form {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--bg-color);
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .add-form { grid-template-columns: 1fr; }
            .settings-box { flex-direction: column; align-items: stretch; }
        }

        button {
            cursor: pointer;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-family: inherit;
            transition: 0.3s;
        }

        .btn-primary { background: var(--primary-color); color: var(--white); }
        .btn-primary:hover { background: #0a3b24; }
        
        .btn-danger { background: var(--danger); color: var(--white); padding: 5px 10px; font-size: 0.9em; }
        .btn-secondary { background: #6c757d; color: var(--white); }
        .btn-wa { background: #25D366; color: white; text-decoration: none; padding: 5px 10px; border-radius: 5px; font-size: 0.9em; display: inline-flex; align-items: center; gap: 5px;}

        /* جدول القائمة */
        .list-container {
            margin-top: 20px;
        }

        .user-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            background: var(--white);
            transition: 0.2s;
        }

        .user-card:hover {
            background-color: #fcfcfc;
        }

        .user-info {
            flex: 1;
        }

        .user-name { font-weight: bold; font-size: 1.1em; color: var(--text-color); }
        .user-phone { font-size: 0.85em; color: #777; }

        .juz-badge {
            background: var(--accent-color);
            color: var(--white);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-left: 15px;
            min-width: 100px;
            text-align: center;
        }

        .actions {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .move-btn {
            background: #e9ecef;
            color: #333;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.2em;
            padding: 0;
        }
        
        .footer-actions {
            margin-top: 30px;
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        /* تنسيق خاص للطباعة وتصدير PDF */
        .pdf-header { display: none; text-align: center; margin-bottom: 20px; }
        .pdf-header h2 { color: var(--primary-color); }
    </style>
</head>
<body>

<div class="container" id="app-container">
    <header>
        <h1>📖 منظم الختمة الجماعية</h1>
        <div class="date-display" id="currentDateDisplay">جاري تحميل التاريخ...</div>
    </header>

    <div class="settings-box" data-html2canvas-ignore="true">
        <label>📅 تاريخ بداية الختمة:</label>
        <input type="date" id="startDateInput" onchange="updateStartDate()">
        <small style="color: #666;">سيتم توزيع الأجزاء بناءً على هذا التاريخ</small>
    </div>

    <div class="add-form" data-html2canvas-ignore="true">
        <input type="text" id="nameInput" placeholder="اسم القارئ">
        <input type="tel" id="phoneInput" placeholder="رقم الهاتف (مع الرمز الدولي)">
        <button class="btn-primary" onclick="addPerson()">+ إضافة شخص</button>
    </div>

    <div id="khatma-list">
        <div class="pdf-header">
            <h2>جدول الختمة اليومية</h2>
            <p id="pdfDate"></p>
        </div>
        <div class="list-container" id="usersList">
            </div>
    </div>

    <div class="footer-actions" data-html2canvas-ignore="true">
        <button class="btn-secondary" onclick="exportPDF()">📄 تحميل الجدول (PDF)</button>
        <button class="btn-danger" onclick="resetAll()" style="margin-right: 10px;">🗑️ حذف الكل</button>
    </div>
</div>

<script>
    // === تهيئة البيانات ===
    let users = [];
    let startDate = new Date().toISOString().split('T')[0]; // الافتراضي اليوم

    // === دوال إدارة البيانات (Local Storage) ===
    function loadData() {
        const storedUsers = localStorage.getItem('khatma_users');
        const storedDate = localStorage.getItem('khatma_start_date');
        
        if (storedUsers) users = JSON.parse(storedUsers);
        if (storedDate) startDate = storedDate;
        
        document.getElementById('startDateInput').value = startDate;
        renderApp();
    }

    function saveData() {
        localStorage.setItem('khatma_users', JSON.stringify(users));
        localStorage.setItem('khatma_start_date', startDate);
        renderApp();
    }

    function updateStartDate() {
        startDate = document.getElementById('startDateInput').value;
        saveData();
    }

    // === دوال الحسابات والمنطق ===
    function getHijriDate() {
        return new Intl.DateTimeFormat('ar-SA-u-ca-islamic', {
            day: 'numeric', month: 'long', year: 'numeric'
        }).format(new Date());
    }

    function getGregorianDate() {
        return new Intl.DateTimeFormat('ar-EG', {
            day: 'numeric', month: 'long', year: 'numeric', weekday: 'long'
        }).format(new Date());
    }

    function calculateJuz(userIndex) {
        // حساب الفرق بالأيام بين تاريخ البداية واليوم
        const start = new Date(startDate);
        const today = new Date();
        
        // تصفير الوقت لحساب الأيام فقط بدقة
        start.setHours(0,0,0,0);
        today.setHours(0,0,0,0);
        
        const diffTime = today - start;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 

        // إذا كان التاريخ في المستقبل، نعتبر الفرق 0
        const daysPassed = diffDays > 0 ? diffDays : 0;

        // المعادلة: (ترتيب الشخص + الأيام المنقضية) % 30
        // نضيف 1 لأن الأجزاء تبدأ من 1 وليس 0
        // مثال: الشخص الأول (index 0) في اليوم الأول (days 0) = (0+0)%30 + 1 = الجزء 1
        // مثال: الشخص الأول في اليوم الثاني (days 1) = (0+1)%30 + 1 = الجزء 2
        let juz = (userIndex + daysPassed) % 30 + 1;
        
        return juz;
    }

    // === دوال العرض (Render) ===
    function renderApp() {
        // تحديث التاريخ في الأعلى
        const dateStr = `${getGregorianDate()} | ${getHijriDate()}`;
        document.getElementById('currentDateDisplay').innerText = dateStr;
        document.getElementById('pdfDate').innerText = dateStr;

        const listContainer = document.getElementById('usersList');
        listContainer.innerHTML = '';

        if (users.length === 0) {
            listContainer.innerHTML = '<p style="text-align:center; color:#777;">لا يوجد قراء مضافين حالياً.</p>';
            return;
        }

        users.forEach((user, index) => {
            const currentJuz = calculateJuz(index);
            
            // تجهيز رابط الواتساب
            const waMessage = `السلام عليكم ${user.name}،%0aوردك اليومي من القرآن الكريم هو: *الجزء ${currentJuz}*%0aالتاريخ: ${dateStr}`;
            const waLink = `https://wa.me/${user.phone.replace(/[^0-9]/g, '')}?text=${waMessage}`;

            const div = document.createElement('div');
            div.className = 'user-card';
            div.innerHTML = `
                <div style="display:flex; align-items:center; flex:1;">
                    <div class="actions" data-html2canvas-ignore="true" style="flex-direction:column; margin-left:10px;">
                        <button class="move-btn" onclick="moveUser(${index}, -1)">▲</button>
                        <button class="move-btn" onclick="moveUser(${index}, 1)">▼</button>
                    </div>
                    <div class="user-info">
                        <div class="user-name">${index + 1}. ${user.name}</div>
                        <div class="user-phone">${user.phone}</div>
                    </div>
                </div>
                
                <div class="juz-badge">الجزء ${currentJuz}</div>

                <div class="actions" data-html2canvas-ignore="true">
                    <a href="${waLink}" target="_blank" class="btn-wa" title="إرسال عبر واتساب">
                        <span>واتساب</span> 📱
                    </a>
                    <button class="btn-danger" onclick="deleteUser(${index})">×</button>
                </div>
            `;
            listContainer.appendChild(div);
        });
    }

    // === دوال التفاعل ===
    function addPerson() {
        const nameInput = document.getElementById('nameInput');
        const phoneInput = document.getElementById('phoneInput');

        if (nameInput.value.trim() === '') {
            alert('الرجاء كتابة الاسم');
            return;
        }

        users.push({
            name: nameInput.value,
            phone: phoneInput.value
        });

        nameInput.value = '';
        phoneInput.value = '';
        saveData();
    }

    function deleteUser(index) {
        if(confirm('هل أنت متأكد من حذف هذا الشخص؟')) {
            users.splice(index, 1);
            saveData();
        }
    }

    function moveUser(index, direction) {
        // direction: -1 (up), 1 (down)
        if (direction === -1 && index === 0) return; // الأول لا يصعد
        if (direction === 1 && index === users.length - 1) return; // الأخير لا ينزل

        const temp = users[index];
        users[index] = users[index + direction];
        users[index + direction] = temp;
        
        saveData();
    }

    function resetAll() {
        if(confirm('سيتم مسح جميع الأسماء والبيانات.. هل أنت متأكد؟')) {
            localStorage.clear();
            users = [];
            startDate = new Date().toISOString().split('T')[0];
            location.reload();
        }
    }

    function exportPDF() {
        const element = document.getElementById('khatma-list');
        const opt = {
            margin:       10,
            filename:     `توزيع_الختمة_${new Date().toISOString().split('T')[0]}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        // إظهار الترويسة الخاصة بالطباعة مؤقتاً
        document.querySelector('.pdf-header').style.display = 'block';
        
        html2pdf().set(opt).from(element).save().then(() => {
            // إخفاء الترويسة بعد الانتهاء
            document.querySelector('.pdf-header').style.display = 'none';
        });
    }

    // === التشغيل عند البداية ===
    loadData();

</script>

</body>
</html>
