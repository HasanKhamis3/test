<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الختمة القرآنية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --primary: #006064;      /* لون أساسي داكن */
            --primary-light: #00838f; /* لون أساسي فاتح */
            --accent: #fbc02d;       /* لون ذهبي للإجراءات */
            --bg: #f5f7fa;
            --white: #ffffff;
            --text: #37474f;
            --border: #cfd8dc;
            --danger: #ef5350;
            --success: #66bb6a;
        }

        * { box-sizing: border-box; outline: none; }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--text);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--white);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            overflow: hidden;
            min-height: 80vh;
        }

        /* --- القائمة العلوية (Tabs) --- */
        .nav-tabs {
            display: flex;
            background: #fff;
            border-bottom: 2px solid var(--border);
            padding: 0 20px;
        }

        .nav-item {
            padding: 20px 30px;
            cursor: pointer;
            font-weight: bold;
            color: #78909c;
            border-bottom: 4px solid transparent;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-item:hover { background: #fcfcfc; color: var(--primary); }
        .nav-item.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* --- محتوى الصفحات --- */
        .tab-content { display: none; padding: 30px; }
        .tab-content.active { display: block; }

        /* --- تنسيقات الجدول (الصفحة الرئيسية) --- */
        .dashboard-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-box {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        table.main-table { width: 100%; border-collapse: collapse; min-width: 800px; }
        table.main-table th { background: #eceff1; padding: 15px; text-align: right; color: var(--text); }
        table.main-table td { padding: 12px; border-bottom: 1px solid #eee; }
        .juz-badge { background: var(--primary-light); color: white; padding: 3px 10px; border-radius: 12px; font-size: 0.9em; }

        /* --- تنسيقات الإعدادات (الصفحة الجديدة) --- */
        .settings-section {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            position: relative;
        }

        .section-title {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--primary);
            border-bottom: 2px dashed #eee;
            padding-bottom: 10px;
            font-size: 1.2em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9em; color: #546e7a; }
        
        .input-wrapper { display: flex; gap: 0; }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: 'Tajawal';
            transition: 0.3s;
        }
        
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,96,100,0.1); }

        /* تنسيق رقم الهاتف المقسم */
        .phone-group select {
            width: 35%;
            border-radius: 0 6px 6px 0;
            border-left: none;
            background: #f1f1f1;
        }
        .phone-group input {
            width: 65%;
            border-radius: 6px 0 0 6px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Tajawal';
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-save { background: var(--success); color: white; width: 100%; justify-content: center; padding: 15px; font-size: 1.1em; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-danger { background: #ffebee; color: var(--danger); }

        /* --- Modals --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; display: none;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal { background: white; width: 100%; max-width: 500px; padding: 25px; border-radius: 10px; max-height: 90vh; overflow-y: auto; }

    </style>
</head>
<body>

<div class="container">
    <nav class="nav-tabs">
        <div class="nav-item active" onclick="switchTab('dashboard')">🏠 الرئيسية (الجدول)</div>
        <div class="nav-item" onclick="switchTab('settings')">⚙️ الإعدادات</div>
    </nav>

    <div id="dashboard" class="tab-content active">
        <div class="dashboard-header">
            <h2 style="margin:0">لوحة الختمة الجماعية</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <small>تاريخ البدء</small>
                    <div id="dashStartDate" style="font-weight:bold">--</div>
                </div>
                <div class="stat-box">
                    <small>تاريخ النهاية المتوقع</small>
                    <div id="dashEndDate" style="font-weight:bold">--</div>
                </div>
                <div class="stat-box">
                    <small>عدد القراء</small>
                    <div id="dashCount" style="font-weight:bold">0</div>
                </div>
            </div>
        </div>

        <div style="margin-bottom: 20px; display:flex; gap:10px;">
            <button class="btn btn-primary" onclick="openAddModal()">+ إضافة قارئ</button>
            <button class="btn btn-outline" onclick="exportTodayPDF()">📄 طباعة قائمة اليوم</button>
        </div>

        <div style="overflow-x: auto;">
            <table class="main-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>الاسم</th>
                        <th>رقم الهاتف</th>
                        <th>الجزء اليوم</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="settings" class="tab-content">
        
        <div class="settings-section">
            <h3 class="section-title">👤 الملف الشخصي (المشرف)</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>الاسم الأول</label>
                    <input type="text" id="profileFirstName" placeholder="الاسم الأول">
                </div>
                <div class="form-group">
                    <label>الاسم الأخير</label>
                    <input type="text" id="profileLastName" placeholder="اسم العائلة">
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="profileEmail" placeholder="example@mail.com">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <div class="input-wrapper phone-group">
                        <select id="profileCountryCode">
                            <option value="+966">🇸🇦 +966</option>
                            <option value="+973">🇧🇭 +973</option>
                            <option value="+971">🇦🇪 +971</option>
                            <option value="+965">🇰🇼 +965</option>
                            <option value="+974">🇶🇦 +974</option>
                            <option value="+968">🇴🇲 +968</option>
                            <option value="+20">🇪🇬 +20</option>
                            <option value="+962">🇯🇴 +962</option>
                            <option value="+964">🇮🇶 +964</option>
                        </select>
                        <input type="tel" id="profilePhone" placeholder="5xxxxxxxx">
                    </div>
                </div>
            </div>
            <div style="margin-top: 15px;">
                <button class="btn btn-outline" onclick="resetPasswordMock()">🔒 إعادة تعيين كلمة المرور</button>
            </div>
        </div>

        <div class="settings-section">
            <h3 class="section-title">📅 إعدادات تواريخ الختمة</h3>
            <p style="font-size:0.9em; color:#666; margin-bottom:15px;">يؤثر هذا القسم مباشرة على توزيع الأجزاء في الجدول الرئيسي.</p>
            
            <div class="form-grid">
                <div class="form-group">
                    <label>تاريخ البدء (ميلادي)</label>
                    <input type="date" id="settingStartGreg" onchange="autoCalcDates()">
                </div>
                <div class="form-group">
                    <label>تاريخ الانتهاء (ميلادي - تلقائي)</label>
                    <input type="date" id="settingEndGreg">
                </div>

                <div class="form-group">
                    <label>تاريخ البدء (هجري)</label>
                    <input type="text" id="settingStartHijri" placeholder="مثال: 01 رمضان 1445">
                </div>
                <div class="form-group">
                    <label>تاريخ الانتهاء (هجري - تلقائي)</label>
                    <input type="text" id="settingEndHijri" placeholder="يتم الحساب تلقائياً">
                </div>
            </div>
        </div>

        <div class="settings-section">
            <h3 class="section-title">🔔 المراسلات والتنبيهات</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>رقم واتساب للتنبيهات</label>
                    <div class="input-wrapper phone-group">
                        <select id="notifCountryCode">
                             <option value="+966">🇸🇦 +966</option>
                            <option value="+973">🇧🇭 +973</option>
                            <option value="+971">🇦🇪 +971</option>
                            <option value="+965">🇰🇼 +965</option>
                            <option value="+974">🇶🇦 +974</option>
                            <option value="+968">🇴🇲 +968</option>
                            <option value="+20">🇪🇬 +20</option>
                            <option value="+962">🇯🇴 +962</option>
                        </select>
                        <input type="tel" id="notifPhone" placeholder="رقم الواتساب">
                    </div>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني للمراسلات</label>
                    <input type="email" id="notifEmail" placeholder="email@domain.com">
                </div>
            </div>
        </div>

        <button class="btn btn-save" onclick="saveAllSettings()">💾 حفظ كافة التغييرات</button>
    </div>
</div>

<div class="modal-overlay" id="userModal">
    <div class="modal">
        <h3>بيانات القارئ</h3>
        <input type="hidden" id="editIndex">
        <div class="form-group">
            <label>الاسم</label>
            <input type="text" id="inputName">
        </div>
        <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="tel" id="inputPhone">
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button class="btn btn-danger" onclick="document.getElementById('userModal').style.display='none'">إلغاء</button>
            <button class="btn btn-primary" onclick="saveUser()">حفظ</button>
        </div>
    </div>
</div>

<script>
    // === 1. إدارة الحالة (State) ===
    let users = [];
    let appSettings = {
        profile: { first: '', last: '', email: '', cc: '+966', phone: '' },
        dates: { 
            startG: new Date().toISOString().split('T')[0], 
            endG: '', 
            startH: '', 
            endH: '' 
        },
        notif: { cc: '+966', phone: '', email: '' }
    };

    // === 2. التهيئة والتحميل ===
    window.onload = function() {
        loadData();
        renderDashboard();
        populateSettingsForm();
    };

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        // تفعيل زر التبويب
        const activeNav = tabId === 'dashboard' ? 0 : 1;
        document.querySelectorAll('.nav-item')[activeNav].classList.add('active');
    }

    // === 3. منطق الإعدادات والتواريخ ===
    function autoCalcDates() {
        const startGStr = document.getElementById('settingStartGreg').value;
        if (!startGStr) return;

        const start = new Date(startGStr);
        const end = new Date(start);
        end.setDate(end.getDate() + 29); // إضافة 29 يوم (مدة 30 يوم)

        // تعيين الميلادي
        document.getElementById('settingEndGreg').value = end.toISOString().split('T')[0];

        // تقدير الهجري (تحويل تقريبي للعرض)
        const hijriStart = new Intl.DateTimeFormat('ar-SA-u-ca-islamic', {day:'numeric', month:'long', year:'numeric'}).format(start);
        const hijriEnd = new Intl.DateTimeFormat('ar-SA-u-ca-islamic', {day:'numeric', month:'long', year:'numeric'}).format(end);

        // تعبئة حقول الهجري إذا كانت فارغة
        if(!document.getElementById('settingStartHijri').value) {
            document.getElementById('settingStartHijri').value = hijriStart;
        }
        document.getElementById('settingEndHijri').value = hijriEnd;
    }

    function saveAllSettings() {
        // جمع البيانات من النموذج
        appSettings.profile = {
            first: document.getElementById('profileFirstName').value,
            last: document.getElementById('profileLastName').value,
            email: document.getElementById('profileEmail').value,
            cc: document.getElementById('profileCountryCode').value,
            phone: document.getElementById('profilePhone').value
        };

        appSettings.dates = {
            startG: document.getElementById('settingStartGreg').value,
            endG: document.getElementById('settingEndGreg').value,
            startH: document.getElementById('settingStartHijri').value,
            endH: document.getElementById('settingEndHijri').value
        };

        appSettings.notif = {
            cc: document.getElementById('notifCountryCode').value,
            phone: document.getElementById('notifPhone').value,
            email: document.getElementById('notifEmail').value
        };

        // الحفظ في LocalStorage
        localStorage.setItem('khatma_settings_v4', JSON.stringify(appSettings));
        
        // تحديث الواجهة الرئيسية
        renderDashboard();
        alert('✅ تم حفظ الإعدادات بنجاح وتحديث الجدول!');
        switchTab('dashboard');
    }

    function loadData() {
        const storedUsers = localStorage.getItem('khatma_users_final'); // استخدام نفس مفتاح المستخدمين السابق
        const storedSettings = localStorage.getItem('khatma_settings_v4');

        if (storedUsers) users = JSON.parse(storedUsers);
        if (storedSettings) {
            appSettings = JSON.parse(storedSettings);
        } else {
            // تشغيل الحساب التلقائي لأول مرة
            setTimeout(autoCalcDates, 100); 
        }
    }

    function populateSettingsForm() {
        // تعبئة الملف الشخصي
        document.getElementById('profileFirstName').value = appSettings.profile.first;
        document.getElementById('profileLastName').value = appSettings.profile.last;
        document.getElementById('profileEmail').value = appSettings.profile.email;
        document.getElementById('profileCountryCode').value = appSettings.profile.cc;
        document.getElementById('profilePhone').value = appSettings.profile.phone;

        // تعبئة التواريخ
        document.getElementById('settingStartGreg').value = appSettings.dates.startG;
        document.getElementById('settingEndGreg').value = appSettings.dates.endG;
        document.getElementById('settingStartHijri').value = appSettings.dates.startH;
        document.getElementById('settingEndHijri').value = appSettings.dates.endH;

        // تعبئة التنبيهات
        document.getElementById('notifCountryCode').value = appSettings.notif.cc;
        document.getElementById('notifPhone').value = appSettings.notif.phone;
        document.getElementById('notifEmail').value = appSettings.notif.email;
    }

    function resetPasswordMock() {
        // محاكاة لأن الموقع يعمل على المتصفح فقط
        const newPass = prompt("أدخل كلمة المرور الجديدة:");
        if(newPass) alert("تم تغيير كلمة المرور بنجاح (محاكاة)");
    }

    // === 4. منطق الجدول الرئيسي ===
    function calculateJuz(index) {
        const startDate = new Date(appSettings.dates.startG);
        const today = new Date();
        today.setHours(0,0,0,0); startDate.setHours(0,0,0,0);
        
        const diff = Math.ceil((today - startDate) / (1000 * 60 * 60 * 24));
        const offset = diff > 0 ? diff : 0;
        
        return ((index + offset) % 30) + 1;
    }

    function renderDashboard() {
        // تحديث الهيدر
        document.getElementById('dashStartDate').innerText = appSettings.dates.startG || 'غير محدد';
        document.getElementById('dashEndDate').innerText = appSettings.dates.endG || 'غير محدد';
        document.getElementById('dashCount').innerText = users.length;

        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = '';

        users.forEach((user, index) => {
            const juz = calculateJuz(index);
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td style="font-weight:bold">${user.name}</td>
                <td>${user.phone}</td>
                <td><span class="juz-badge">جزء ${juz}</span></td>
                <td>
                    <button class="btn btn-danger" style="padding:5px 10px; font-size:0.8em" onclick="deleteUser(${index})">حذف</button>
                    <button class="btn btn-primary" style="padding:5px 10px; font-size:0.8em" onclick="editUser(${index})">تعديل</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // === 5. إدارة المستخدمين (CRUD) ===
    function openAddModal() {
        document.getElementById('inputName').value = '';
        document.getElementById('inputPhone').value = '';
        document.getElementById('editIndex').value = '-1';
        document.getElementById('userModal').style.display = 'flex';
    }

    function editUser(index) {
        document.getElementById('inputName').value = users[index].name;
        document.getElementById('inputPhone').value = users[index].phone;
        document.getElementById('editIndex').value = index;
        document.getElementById('userModal').style.display = 'flex';
    }

    function saveUser() {
        const name = document.getElementById('inputName').value;
        const phone = document.getElementById('inputPhone').value;
        const index = parseInt(document.getElementById('editIndex').value);

        if(!name) return;

        if(index === -1) users.push({name, phone});
        else users[index] = {name, phone};

        localStorage.setItem('khatma_users_final', JSON.stringify(users));
        renderDashboard();
        document.getElementById('userModal').style.display = 'none';
    }

    function deleteUser(index) {
        if(confirm('حذف هذا القارئ؟')) {
            users.splice(index, 1);
            localStorage.setItem('khatma_users_final', JSON.stringify(users));
            renderDashboard();
        }
    }

    function exportTodayPDF() {
        const element = document.querySelector('.main-table');
        const opt = {
            margin: 10,
            filename: 'جدول_الختمة.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
        };
        html2pdf().set(opt).from(element).save();
    }
</script>

</body>
</html>
