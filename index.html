<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الختمة القرآنية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --primary: #006064;
            --primary-light: #00838f;
            --accent: #fbc02d;
            --bg: #f5f7fa;
            --white: #ffffff;
            --text: #37474f;
            --border: #cfd8dc;
            --danger: #ef5350;
            --success: #66bb6a;
            --wa-color: #25D366;
            --pdf-color: #F40F02;
        }

        * { box-sizing: border-box; outline: none; }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--text);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--white);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            overflow: hidden;
            min-height: 80vh;
        }

        /* --- القائمة العلوية (Tabs) --- */
        .nav-tabs {
            display: flex;
            background: #fff;
            border-bottom: 2px solid var(--border);
            padding: 0 20px;
        }

        .nav-item {
            padding: 20px 30px;
            cursor: pointer;
            font-weight: bold;
            color: #78909c;
            border-bottom: 4px solid transparent;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-item:hover { background: #fcfcfc; color: var(--primary); }
        .nav-item.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* --- محتوى الصفحات --- */
        .tab-content { display: none; padding: 30px; }
        .tab-content.active { display: block; }

        /* --- تنسيقات الجدول (الصفحة الرئيسية) --- */
        .dashboard-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-box {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* تنسيق الجدول */
        table.main-table { width: 100%; border-collapse: collapse; min-width: 900px; }
        table.main-table th { background: #eceff1; padding: 15px; text-align: right; color: var(--text); white-space: nowrap; }
        table.main-table td { padding: 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
        table.main-table tr:hover { background: #fafafa; }
        .juz-badge { background: var(--primary-light); color: white; padding: 3px 10px; border-radius: 12px; font-size: 0.9em; font-weight: bold; }

        /* --- أزرار الإجراءات الجديدة (7 أزرار) --- */
        .actions-group {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        
        .act-btn {
            border: none;
            border-radius: 4px;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1em;
            transition: 0.2s;
            color: white;
            position: relative;
        }
        
        .act-btn:hover { transform: translateY(-2px); opacity: 0.9; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .act-btn svg { width: 18px; height: 18px; fill: currentColor; }

        /* ألوان الأزرار حسب الوظيفة */
        .btn-edit { background: #FFB300; }     /* تعديل - برتقالي */
        .btn-up { background: #78909C; }       /* رفع - رمادي */
        .btn-down { background: #78909C; }     /* تنزيل - رمادي */
        .btn-wa-text { background: #25D366; }  /* واتساب نص - أخضر */
        .btn-wa-pdf { background: #128C7E; }   /* واتساب ملف - أخضر غامق */
        .btn-pdf { background: #D32F2F; }      /* تنزيل PDF - أحمر */
        .btn-del { background: #37474F; }      /* حذف - رمادي غامق */

        /* --- تنسيقات الإعدادات --- */
        .settings-section {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .section-title {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--primary);
            border-bottom: 2px dashed #eee;
            padding-bottom: 10px;
            font-size: 1.2em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        /* تنسيق صفوف التواريخ (سطر كامل لكل نوع) */
        .dates-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .date-row-block {
            background: #fcfcfc;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        .date-row-header {
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.05em;
        }

        .dates-inputs-flex {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group { margin-bottom: 0; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9em; color: #546e7a; }
        
        .input-wrapper { display: flex; gap: 0; }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: 'Tajawal';
            transition: 0.3s;
        }
        
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,96,100,0.1); }

        .phone-group select { width: 35%; border-radius: 0 6px 6px 0; border-left: none; background: #f1f1f1; }
        .phone-group input { width: 65%; border-radius: 6px 0 0 6px; }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Tajawal';
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-save { background: var(--success); color: white; width: 100%; justify-content: center; padding: 15px; font-size: 1.1em; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-danger { background: #ffebee; color: var(--danger); }

        /* --- Modals --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; display: none;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal { background: white; width: 100%; max-width: 500px; padding: 25px; border-radius: 10px; max-height: 90vh; overflow-y: auto; }

        /* --- حاوية مخفية لتوليد PDF --- */
        #hidden-pdf-container { position: absolute; left: -9999px; width: 800px; }
        
        /* تنسيق جدول PDF الداخلي */
        .pdf-schedule { width: 100%; border-collapse: collapse; text-align: center; font-family: 'Tajawal'; margin-top: 10px; }
        .pdf-schedule th { background: #006064; color: white; padding: 8px; border: 1px solid #333; }
        .pdf-schedule td { border: 1px solid #333; padding: 6px; font-size: 12px; }
        .pdf-header { text-align: center; background: #e0f2f1; padding: 15px; margin-bottom: 10px; border: 1px solid #333; }
        
    </style>
</head>
<body>

<div class="container">
    <nav class="nav-tabs">
        <div class="nav-item active" onclick="switchTab('dashboard')">🏠 الرئيسية (الجدول)</div>
        <div class="nav-item" onclick="switchTab('settings')">⚙️ الإعدادات</div>
    </nav>

    <div id="dashboard" class="tab-content active">
        <div class="dashboard-header">
            <h2 style="margin:0">لوحة الختمة الجماعية</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <small>تاريخ البدء</small>
                    <div id="dashStartDate" style="font-weight:bold">--</div>
                </div>
                <div class="stat-box">
                    <small>تاريخ النهاية المتوقع</small>
                    <div id="dashEndDate" style="font-weight:bold">--</div>
                </div>
                <div class="stat-box">
                    <small>عدد القراء</small>
                    <div id="dashCount" style="font-weight:bold">0</div>
                </div>
            </div>
        </div>

        <div style="margin-bottom: 20px; display:flex; gap:10px;">
            <button class="btn btn-primary" onclick="openAddModal()">+ إضافة قارئ</button>
            <button class="btn btn-outline" onclick="exportTodayPDF()">📄 طباعة قائمة اليوم</button>
        </div>

        <div style="overflow-x: auto;">
            <table class="main-table">
                <thead>
                    <tr>
                        <th style="width: 50px;">#</th>
                        <th>الاسم</th>
                        <th>رقم الهاتف</th>
                        <th>الجزء اليوم</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="settings" class="tab-content">
        
        <div class="settings-section">
            <h3 class="section-title">👤 الملف الشخصي (المشرف)</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>الاسم الأول</label>
                    <input type="text" id="profileFirstName" placeholder="الاسم الأول">
                </div>
                <div class="form-group">
                    <label>الاسم الأخير</label>
                    <input type="text" id="profileLastName" placeholder="اسم العائلة">
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="profileEmail" placeholder="example@mail.com">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <div class="input-wrapper phone-group">
                        <select id="profileCountryCode">
                            <option value="+966">🇸🇦 +966</option>
                            <option value="+973">🇧🇭 +973</option>
                            <option value="+971">🇦🇪 +971</option>
                            <option value="+965">🇰🇼 +965</option>
                            <option value="+974">🇶🇦 +974</option>
                            <option value="+968">🇴🇲 +968</option>
                            <option value="+20">🇪🇬 +20</option>
                            <option value="+962">🇯🇴 +962</option>
                            <option value="+964">🇮🇶 +964</option>
                        </select>
                        <input type="tel" id="profilePhone" placeholder="5xxxxxxxx">
                    </div>
                </div>
            </div>
            <div style="margin-top: 15px;">
                <button class="btn btn-outline" onclick="resetPasswordMock()">🔒 إعادة تعيين كلمة المرور</button>
            </div>
        </div>

        <div class="settings-section">
            <h3 class="section-title">📅 إعدادات تواريخ الختمة</h3>
            
            <div class="dates-container">
                <div class="date-row-block">
                    <div class="date-row-header">📅 التواريخ الميلادية</div>
                    <div class="dates-inputs-flex">
                        <div class="form-group">
                            <label>تاريخ البدء (ميلادي)</label>
                            <input type="date" id="settingStartGreg" onchange="autoCalcDates()">
                        </div>
                        <div class="form-group">
                            <label>تاريخ الانتهاء (ميلادي - تلقائي)</label>
                            <input type="date" id="settingEndGreg">
                        </div>
                    </div>
                </div>

                <div class="date-row-block">
                    <div class="date-row-header">🌙 التواريخ الهجرية</div>
                    <div class="dates-inputs-flex">
                        <div class="form-group">
                            <label>تاريخ البدء (هجري - كلندر)</label>
                            <input type="date" id="settingStartHijriInput" onchange="updateHijriDisplay()">
                            <small id="hijriStartDisplay" style="color:#666; display:block; margin-top:5px;"></small>
                        </div>
                        <div class="form-group">
                            <label>تاريخ الانتهاء (هجري - تلقائي)</label>
                            <input type="date" id="settingEndHijriInput" readonly>
                            <small id="hijriEndDisplay" style="color:#666; display:block; margin-top:5px;"></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="settings-section">
            <h3 class="section-title">🔔 المراسلات والتنبيهات</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>رقم واتساب للتنبيهات</label>
                    <div class="input-wrapper phone-group">
                        <select id="notifCountryCode">
                             <option value="+966">🇸🇦 +966</option>
                            <option value="+973">🇧🇭 +973</option>
                            <option value="+971">🇦🇪 +971</option>
                            <option value="+965">🇰🇼 +965</option>
                            <option value="+974">🇶🇦 +974</option>
                            <option value="+968">🇴🇲 +968</option>
                            <option value="+20">🇪🇬 +20</option>
                            <option value="+962">🇯🇴 +962</option>
                        </select>
                        <input type="tel" id="notifPhone" placeholder="رقم الواتساب">
                    </div>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني للمراسلات</label>
                    <input type="email" id="notifEmail" placeholder="email@domain.com">
                </div>
            </div>
        </div>

        <button class="btn btn-save" onclick="saveAllSettings()">💾 حفظ كافة التغييرات</button>
    </div>
</div>

<div class="modal-overlay" id="userModal">
    <div class="modal">
        <h3>بيانات القارئ</h3>
        <input type="hidden" id="editIndex">
        <div class="form-group">
            <label>الاسم</label>
            <input type="text" id="inputName">
        </div>
        <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="tel" id="inputPhone">
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button class="btn btn-danger" onclick="document.getElementById('userModal').style.display='none'">إلغاء</button>
            <button class="btn btn-primary" onclick="saveUser()">حفظ</button>
        </div>
    </div>
</div>

<div id="hidden-pdf-container"></div>

<script>
    // === 1. إدارة الحالة (State) ===
    let users = [];
    let appSettings = {
        profile: { first: '', last: '', email: '', cc: '+966', phone: '' },
        dates: { 
            startG: new Date().toISOString().split('T')[0], 
            endG: '', 
            startH: '', 
            endH: '' 
        },
        notif: { cc: '+966', phone: '', email: '' }
    };

    // === 2. التهيئة والتحميل ===
    window.onload = function() {
        loadData();
        renderDashboard();
        populateSettingsForm();
    };

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        const activeNav = tabId === 'dashboard' ? 0 : 1;
        document.querySelectorAll('.nav-item')[activeNav].classList.add('active');
    }

    // === 3. منطق الإعدادات والتواريخ ===
    function autoCalcDates() {
        const startGStr = document.getElementById('settingStartGreg').value;
        if (!startGStr) return;

        const start = new Date(startGStr);
        const end = new Date(start);
        end.setDate(end.getDate() + 29); // +29 days (total 30)

        // تعيين الميلادي
        document.getElementById('settingEndGreg').value = end.toISOString().split('T')[0];

        // تهيئة الهجري إذا كان فارغاً
        if(!document.getElementById('settingStartHijriInput').value) {
            document.getElementById('settingStartHijriInput').value = startGStr;
        }
        updateHijriDisplay();
    }

    function updateHijriDisplay() {
        // حساب تاريخ النهاية الهجري
        const startHVal = document.getElementById('settingStartHijriInput').value;
        if(startHVal) {
            const startH = new Date(startHVal);
            const endH = new Date(startH);
            endH.setDate(endH.getDate() + 29);
            document.getElementById('settingEndHijriInput').value = endH.toISOString().split('T')[0];

            // عرض توضيحي
            document.getElementById('hijriStartDisplay').innerText = "تم اختيار التاريخ: " + startH.toLocaleDateString('ar-SA');
            document.getElementById('hijriEndDisplay').innerText = "نهاية الختمة (تقديري): " + endH.toLocaleDateString('ar-SA');
        }
    }

    function saveAllSettings() {
        appSettings.profile = {
            first: document.getElementById('profileFirstName').value,
            last: document.getElementById('profileLastName').value,
            email: document.getElementById('profileEmail').value,
            cc: document.getElementById('profileCountryCode').value,
            phone: document.getElementById('profilePhone').value
        };

        appSettings.dates = {
            startG: document.getElementById('settingStartGreg').value,
            endG: document.getElementById('settingEndGreg').value,
            startH: document.getElementById('settingStartHijriInput').value,
            endH: document.getElementById('settingEndHijriInput').value
        };

        appSettings.notif = {
            cc: document.getElementById('notifCountryCode').value,
            phone: document.getElementById('notifPhone').value,
            email: document.getElementById('notifEmail').value
        };

        localStorage.setItem('khatma_settings_v4', JSON.stringify(appSettings));
        renderDashboard();
        alert('✅ تم حفظ الإعدادات بنجاح!');
        switchTab('dashboard');
    }

    function loadData() {
        const storedUsers = localStorage.getItem('khatma_users_final');
        const storedSettings = localStorage.getItem('khatma_settings_v4');

        if (storedUsers) users = JSON.parse(storedUsers);
        if (storedSettings) {
            appSettings = JSON.parse(storedSettings);
        } else {
            setTimeout(autoCalcDates, 100); 
        }
    }

    function populateSettingsForm() {
        // Profile
        document.getElementById('profileFirstName').value = appSettings.profile.first;
        document.getElementById('profileLastName').value = appSettings.profile.last;
        document.getElementById('profileEmail').value = appSettings.profile.email;
        document.getElementById('profileCountryCode').value = appSettings.profile.cc;
        document.getElementById('profilePhone').value = appSettings.profile.phone;

        // Dates
        document.getElementById('settingStartGreg').value = appSettings.dates.startG;
        document.getElementById('settingEndGreg').value = appSettings.dates.endG;
        document.getElementById('settingStartHijriInput').value = appSettings.dates.startH;
        document.getElementById('settingEndHijriInput').value = appSettings.dates.endH;
        updateHijriDisplay();

        // Notif
        document.getElementById('notifCountryCode').value = appSettings.notif.cc;
        document.getElementById('notifPhone').value = appSettings.notif.phone;
        document.getElementById('notifEmail').value = appSettings.notif.email;
    }

    function resetPasswordMock() {
        const newPass = prompt("أدخل كلمة المرور الجديدة:");
        if(newPass) alert("تم تغيير كلمة المرور بنجاح (محاكاة)");
    }

    // === 4. منطق الجدول الرئيسي ===
    function calculateJuz(index, dayOffset = 0) {
        const startDate = new Date(appSettings.dates.startG);
        const today = new Date();
        today.setHours(0,0,0,0); startDate.setHours(0,0,0,0);
        
        let diff = Math.ceil((today - startDate) / (1000 * 60 * 60 * 24));
        if (dayOffset !== 0) diff = dayOffset;
        
        const offset = diff > 0 ? diff : 0;
        return ((index + offset) % 30) + 1;
    }

    function renderDashboard() {
        // Stats
        document.getElementById('dashStartDate').innerText = appSettings.dates.startG || '--';
        document.getElementById('dashEndDate').innerText = appSettings.dates.endG || '--';
        document.getElementById('dashCount').innerText = users.length;

        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = '';

        users.forEach((user, index) => {
            const juz = calculateJuz(index);
            const tr = document.createElement('tr');
            
            // --- الأزرار السبعة المطلوبة ---
            const actionsHTML = `
                <div class="actions-group">
                    <button class="act-btn btn-edit" onclick="editUser(${index})" title="تعديل">✎</button>
                    <button class="act-btn btn-up" onclick="moveUser(${index}, -1)" title="رفع الترتيب">▲</button>
                    <button class="act-btn btn-down" onclick="moveUser(${index}, 1)" title="تنزيل الترتيب">▼</button>
                    <button class="act-btn btn-wa-text" onclick="sendWaDaily(${index})" title="إرسال واتساب (نص)">💬</button>
                    <button class="act-btn btn-wa-pdf" onclick="sendWaFile(${index})" title="إرسال واتساب (PDF)">📂</button>
                    <button class="act-btn btn-pdf" onclick="generateUserPDF(${index}, 'download')" title="تنزيل PDF">⬇</button>
                    <button class="act-btn btn-del" onclick="deleteUser(${index})" title="حذف">✖</button>
                </div>
            `;

            tr.innerHTML = `
                <td>${index + 1}</td>
                <td style="font-weight:bold">${user.name}</td>
                <td>${user.phone}</td>
                <td><span class="juz-badge">جزء ${juz}</span></td>
                <td>${actionsHTML}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // === 5. الوظائف والإجراءات ===
    function moveUser(index, direction) {
        if ((direction === -1 && index === 0) || (direction === 1 && index === users.length - 1)) return;
        const targetIndex = index + direction;
        [users[index], users[targetIndex]] = [users[targetIndex], users[index]];
        localStorage.setItem('khatma_users_final', JSON.stringify(users));
        renderDashboard();
    }

    function sendWaDaily(index) {
        const user = users[index];
        const juz = calculateJuz(index);
        const text = `السلام عليكم ${user.name}،%0aوردك اليومي: *الجزء ${juz}*%0aالتاريخ: ${new Date().toLocaleDateString('ar-EG')}`;
        window.open(`https://wa.me/${user.phone.replace(/[^0-9]/g,'')}?text=${text}`, '_blank');
    }

    function sendWaFile(index) {
        // 1. تنزيل الملف
        generateUserPDF(index, 'download');
        // 2. فتح الواتساب
        setTimeout(() => {
            const user = users[index];
            const text = `السلام عليكم ${user.name}،%0aمرفق لكم جدول الختمة الكامل (PDF).%0a(تم تنزيل الملف في جهازك، يرجى إرفاقه).`;
            window.open(`https://wa.me/${user.phone.replace(/[^0-9]/g,'')}?text=${text}`, '_blank');
        }, 1000);
    }

    // توليد PDF للمستخدم الواحد
    function generateUserPDF(index, action) {
        const user = users[index];
        const startDate = new Date(appSettings.dates.startG);
        
        let html = `
            <div class="pdf-header">
                <h2>جدول الختمة القرآنية</h2>
                <h3>القاريء: ${user.name}</h3>
                <p>الفترة من: ${appSettings.dates.startG} إلى ${appSettings.dates.endG}</p>
            </div>
            <table class="pdf-schedule">
                <thead><tr><th>م</th><th>اليوم</th><th>التاريخ</th><th>الجزء</th></tr></thead>
                <tbody>
        `;
        
        for(let i=0; i<30; i++) {
            const d = new Date(startDate); d.setDate(d.getDate() + i);
            const juz = calculateJuz(index, i); 
            html += `<tr>
                <td>${i+1}</td>
                <td>${d.toLocaleDateString('ar-EG', {weekday:'long'})}</td>
                <td>${d.toISOString().split('T')[0]}</td>
                <td>الجزء ${juz}</td>
            </tr>`;
        }
        html += `</tbody></table>`;

        const container = document.getElementById('hidden-pdf-container');
        container.innerHTML = html;

        const opt = {
            margin: 10,
            filename: `جدول_${user.name}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(container).save().then(() => {
            container.innerHTML = '';
        });
    }

    function openAddModal() {
        document.getElementById('inputName').value = '';
        document.getElementById('inputPhone').value = '';
        document.getElementById('editIndex').value = '-1';
        document.getElementById('userModal').style.display = 'flex';
    }

    function editUser(index) {
        document.getElementById('inputName').value = users[index].name;
        document.getElementById('inputPhone').value = users[index].phone;
        document.getElementById('editIndex').value = index;
        document.getElementById('userModal').style.display = 'flex';
    }

    function saveUser() {
        const name = document.getElementById('inputName').value;
        const phone = document.getElementById('inputPhone').value;
        const index = parseInt(document.getElementById('editIndex').value);

        if(!name) return;
        if(index === -1) users.push({name, phone});
        else users[index] = {name, phone};

        localStorage.setItem('khatma_users_final', JSON.stringify(users));
        renderDashboard();
        document.getElementById('userModal').style.display = 'none';
    }

    function deleteUser(index) {
        if(confirm('هل أنت متأكد من حذف هذا القارئ؟')) {
            users.splice(index, 1);
            localStorage.setItem('khatma_users_final', JSON.stringify(users));
            renderDashboard();
        }
    }

    function exportTodayPDF() {
        const element = document.querySelector('.main-table');
        const opt = {
            margin: 10,
            filename: 'قائمة_اليوم.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
        };
        html2pdf().set(opt).from(element).save();
    }
</script>

</body>
</html>
